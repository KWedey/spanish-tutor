# Schema: Session Log
# Source: docs/system-design.md section 5
# This file is the authoritative schema for state/sessions/YYYY-MM-DD.yaml.
# Scripts read this file to validate and generate templates.

fields:
  date:
    type: string
    required: true
    default: ""
    description: "Session date (YYYY-MM-DD)"

  session_number:
    type: int
    required: true
    default: 0
    description: "Sequential session number"

  duration_minutes:
    type: int
    required: true
    default: 0
    description: "Total session duration in minutes"

  learner_energy:
    type: string
    required: false
    default: ""
    description: "high, medium, low (self-reported or inferred)"

  session_type:
    type: string
    required: true
    default: ""
    description: |
      Session type. Includes 9 base types (standard, micro, weekly-review,
      phase-transition, return, first-session, onboarding, sprint, fluency)
      plus 2 overlay strings (onboarding-with-return-overlay,
      maintenance-with-weekly-review) and 2 router-only types (maintenance,
      placement-validation). The 4 added values mirror scripts/route_session.py
      return strings so the session log can persist whatever the router
      decided. Audit C-3: prior enum omitted these, breaking the canary doc's
      `route_session.py state/` verification step.
    enum: ["standard", "micro", "weekly-review", "phase-transition", "return", "first-session", "onboarding", "sprint", "fluency", "maintenance", "onboarding-with-return-overlay", "maintenance-with-weekly-review", "placement-validation"]

  session_status:
    type: string
    required: true
    default: "complete"
    description: "Whether session completed normally"
    enum: ["complete", "partial", "aborted"]

  gap_days:
    type: int
    required: false
    default: 0
    description: "Days since last session (0 if consecutive)"

  assignment_review:
    type: list
    required: false
    default: []
    description: "How yesterday's homework went"
    item_shape:
      task:
        type: string
        required: false
        description: "The assignment being reviewed"
      resource:
        type: string
        required: false
        description: "External tool/resource used"
      completed:
        type: bool
        required: false
        description: "Whether the learner completed it"
      learner_report:
        type: string
        required: false
        description: "What the learner said about it"
      tutor_assessment:
        type: string
        required: false
        description: "What the tutor inferred"
      verification_result:
        type: string
        required: false
        description: "What the tutor observed when testing the claim"
      skill_updates:
        type: list
        required: false
        description: "Free-form skill-map deltas prompted by this review"

  # Agent-maintained: written by the tutor (CLAUDE.md Standard Session Flow /
  # State Updates step 3 input debrief) and read by curriculum + the LLM next
  # session. No Python reader; validate-state only checks nested enums here.
  input_reviewed:
    type: list
    required: false
    default: []
    description: "Input comprehension debrief entries. NOTE: comprehension_assessment here (per-session debrief) feeds the running receptive_skills.comprehension_quality in skill-map (CLAUDE.md State Updates step 3) — the two are intentionally named differently (event log vs. cumulative state)."
    item_shape:
      resource:
        type: string
        required: true
        description: "Resource name (matches resource-tracker)"
      type:
        type: string
        required: true
        enum: ["listening", "reading"]
        description: "Input modality"
      duration_minutes:
        type: int
        required: false
        description: "Minutes of input reviewed"
      passes:
        type: int
        required: false
        description: "Multi-pass count (L2-L3: recommend 2-3)"
      comprehension_assessment:
        type: string
        required: false
        enum: [null, "gist", "main_ideas", "details", "inference"]
        description: "Depth of comprehension demonstrated in the debrief"
      vocabulary_extracted:
        type: list
        required: false
        description: "Words/phrases the learner reported acquiring"
      production_gaps_observed:
        type: list
        required: false
        description: "Words the learner reached for but couldn't produce"
      difficulty_self_report:
        type: string
        required: false
        enum: [null, "too_easy", "just_right", "too_hard"]
        description: "Learner's difficulty self-report"
      level_at_time:
        type: string
        required: false
        description: "Learner's level when the input was assigned (e.g. L2)"

  session_activities:
    type: list
    required: false
    default: []
    description: "Live session content activities"
    item_shape:
      type:
        type: string
        required: false
        description: "Activity type — conversation, grammar-drill, translation, fluency-drill, writing-review, etc."
      target_concepts:
        type: list
        required: false
        description: "Grammar/vocab skill-map keys being practiced"
      duration_minutes:
        type: int
        required: false
        description: "Minutes spent on this activity"
      performance:
        type: string
        required: false
        description: "strong, good, mixed, struggling"
      errors_noted:
        type: list
        required: false
        description: "Per-error records observed during the activity"
        item_shape:
          error:
            type: string
            required: false
            description: "What the learner said"
          correction:
            type: string
            required: false
            description: "What it should have been"
          category:
            type: string
            required: false
            description: "grammar, vocabulary, pronunciation, gender, fluency, cultural"
          concept:
            type: string
            required: false
            description: "Which skill-map entry this maps to"
          error_type:
            type: string
            required: false
            description: "developmental, l1-interference, fossilized, slip"
      observations:
        type: string
        required: false
        description: "Free-text summary of what the tutor observed"
      highlights:
        type: string
        required: false
        description: "Things the learner did well"
      l1_interference_noted:
        type: bool
        required: false
        description: "Whether any L1 interference errors were observed"
      fluency_observations:
        type: string
        required: false
        description: "Pace, hesitation, risk-taking notes"
      notes:
        type: string
        required: false
        description: "Free-text activity notes"

  skill_map_updates:
    type: list
    required: false
    default: []
    description: "Assessment updates to apply to skill-map"
    item_shape:
      concept:
        type: string
        required: false
        description: "Skill-map key being updated"
      field:
        type: string
        required: false
        description: "Field changed — status, error_rate_drills, error_rate_production, error_trend, etc."
      old_value:
        type: string
        required: false
        description: "Value before the update"
      new_value:
        type: string
        required: false
        description: "Value after the update"
      evidence:
        type: string
        required: false
        description: "Why this change was made"

  # Agent-maintained: written by the tutor (decision-engine.md interleaving)
  # and read by curriculum + the LLM next session. No Python reader.
  interleaved_concepts:
    type: list
    required: false
    default: []
    description: "Prior concepts woven into primary concept practice"

  recasts:
    type: list
    required: false
    default: []
    description: "D-05: per-event recast log. Empty list = positive assertion of 'no recasts occurred.' Required when session contains Stage 3/4, fluency, or conversation practice (see check-session-log.py D-06)."
    item_shape:
      concept_id:
        type: string
        required: true
        description: "Grammar concept being corrected (skill-map key)"
      error_form:
        type: string
        required: true
        description: "What the learner said"
      corrected_form:
        type: string
        required: true
        description: "The recast the tutor provided"
      uptake:
        type: string
        required: true
        description: "Whether learner incorporated the corrected form"
        enum: ["landed", "missed", "partial"]
      activity_stage:
        type: string
        required: true
        description: "Activity stage when the recast occurred"
        enum: ["stage-1", "stage-2", "stage-3", "stage-4", "fluency"]

  assignments:
    type: list
    required: false
    default: []
    description: "Homework assignments for before next session"
    # Per-assignment fields are additionally enforced by check-session-log.py.
    item_shape:
      type:
        type: string
        required: true
        default: ""
        description: "Assignment type — anki, writing, listening, reading, drill, journal, etc."
      task:
        type: string
        required: false
        default: ""
        description: "Human-readable description of the assignment (input-orchestration.md Section 1 Step 5; docs/system-design.md)."
      narrow_topic_aligned:
        type: bool
        required: false
        default: false
        description: "True if this assignment aligns with the week's narrow topic (input-orchestration.md Section 1 Step 5)."
      estimated_minutes:
        type: int
        required: true
        default: 0
        description: "Minutes the learner should expect to spend"
      resource:
        type: string
        required: false
        default: ""
        description: "Resource title from curriculum/media-bank.yaml or resources/resource-catalog.yaml"
      target_skill:
        type: string
        required: false
        default: ""
        description: "Which skill-map entry this assignment supports"
      priority:
        type: string
        required: false
        default: ""
        description: "Assignment priority (required = core, recommended = should-do, bonus = optional)"
        enum: ["required", "recommended", "bonus"]
      retrieval_target:
        type: string
        required: false
        default: ""
        description: "Prior concept to revisit in this assignment (e.g. 'include 2 ser/estar sentences')"
      dialect_advisory:
        type: string
        required: false
        default: ""
        description: |
          Required when the assignment matches the dialect-mismatch trigger matrix in
          input-orchestration.md Section 1 Step 2 (mixed/neutral resource + voseo/vosotros
          target_dialect, or peninsular resource + non-es-ES target_dialect).
        enum: ["voseo", "vosotros", "voseo+vosotros"]
      notes:
        type: string
        required: false
        default: ""
        description: "Free-text note or prompt for the assignment"

  # Agent-maintained: written by the tutor when a journal entry is submitted
  # (CLAUDE.md Review & Warm-up journal review) and read by the human / the LLM
  # next session. No Python reader.
  journal_review:
    type: map
    required: false
    default: null
    description: "Journal entry review (if applicable)"
    children:
      entry_date:
        type: string
        required: false
        default: ""
        description: "Date of journal entry reviewed"
      errors_found:
        type: list
        required: false
        default: []
        description: "Errors found in journal entry"
      quality_notes:
        type: string
        required: false
        default: ""
        description: "Coherence, complexity, improvement from prior entries"

  learner_observations:
    type: map
    required: false
    default: null
    description: "Learner state observations"
    children:
      mood:
        type: string
        required: false
        default: ""
        description: "motivated, neutral, frustrated, tired, excited, anxious"
      engagement:
        type: string
        required: false
        default: ""
        description: "high, medium, low"
      emotional_state:
        type: string
        required: false
        default: ""
        description: "confident, uncertain, embarrassed, breakthrough-joy, struggling"
      self_assessment:
        type: string
        required: false
        default: ""
        description: "What they said about how they're feeling about progress"
      calibration_note:
        type: string
        required: false
        default: ""
        description: "If self-assessment diverges from actual performance"
      autonomy_readiness:
        type: string
        required: false
        default: ""
        description: "Observations about whether learner is ready for more control"
      notes:
        type: string
        required: false
        default: ""
        description: "Free-text observation about the learner's state (used e.g. in the first-session log)"

  assessment:
    type: map
    required: false
    default: null
    description: |
      Initial assessment (session 1 only). Records the placement *event* — what
      was elicited and the decision reached. The persisted placement *result*
      lives in learner-profile.yaml initial_placement (schemas/learner-profile.schema.yaml).
      Field mapping: placement_decision.level -> initial_placement.level,
      placement_decision.confidence -> initial_placement.confidence,
      reading_check.comprehension -> initial_placement.reading_result.
    children:
      self_report:
        type: string
        required: false
        description: "Learner's self-assessed level before prompts"
      grammar_prompts:
        type: map
        required: false
        description: "Elicited production per graded prompt"
        children:
          introduce_yourself:
            type: map
            required: false
            description: "response_summary + scoring (pre-A / early-A / late-A / acquired-A-01)"
          tell_about_yesterday:
            type: map
            required: false
            description: "response_summary + scoring (below-B / early-B / mid-B / acquired-B-01-B-04)"
          what_would_you_do:
            type: map
            required: false
            description: "response_summary + scoring (below-C / early-C / mid-C / acquired-through-C)"
      vocabulary_observation:
        type: map
        required: false
        description: "level (minimal/narrow/broad/deep), domains_demonstrated, production_gap_indicators, follow_up_topic, follow_up_notes"
      reading_check:
        type: map
        required: false
        description: "passage_level + comprehension (below-expected / gets-the-gist / understands-nearly-all)"
      placement_decision:
        type: map
        required: false
        description: "level + confidence (high/medium/low) + rationale"

  validation_checks:
    type: list
    required: false
    default: []
    description: "Placement validation spot-checks (sessions 2-4 only)"

  placement_skipped_sessions:
    type: list
    required: false
    default: []
    description: "Onboarding session numbers skipped due to placement (first-session.md §7: Late-A skips 01-04; Early-B+ logs all 10). Empty/absent for a true-beginner / Early-A first session."

  decision_engine_trace:
    type: map
    required: false
    default: null
    description: "Records why the tutor chose this session's focus — scoring details from concept selection"
    children:
      candidates_scored:
        type: int
        required: false
        default: 0
        description: "Number of concepts evaluated by the decision engine"
      top_candidates:
        type: list
        required: false
        default: []
        description: "Top-scoring candidates with individual dimension scores: {id, NEED, GAP, DECAY, TOPIC, INTEREST, VARIETY, TOTAL}"
        # Per-candidate shape includes: id (string), NEED (int), GAP (int),
        # DECAY (float), TOPIC (int), INTEREST (int 0-3, D-04), VARIETY (int), TOTAL (float)
      selected_primary:
        type: string
        required: false
        default: ""
        description: "Concept ID selected as primary focus"
      selected_secondary:
        type: string
        required: false
        default: ""
        description: "Concept ID selected as secondary focus"
      override_reason:
        type: string
        required: false
        default: null
        description: "Null unless manual override; record reason if so"

  session_difficulty_rating:
    type: string
    required: false
    default: null
    description: "Learner self-report at checkout"
    enum: [null, "too-easy", "just-right", "too-hard"]

  homework_load_rating:
    type: string
    required: false
    default: null
    description: "D-10/LOAD-04: Learner self-report on PRIOR session's homework load. Captured in Review & Warm-up (CLAUDE.md L96). Separate from session_difficulty_rating. Drives D-11 tiered daily_target adjustment via check_daily_target_tier_drift in validate-state.py."
    enum: [null, "too-much", "just-right", "too-light"]

  new_anki_cards:
    type: int
    required: false
    default: 0
    description: |
      QR-R3: Count of NEW Anki cards added this session. Reviewing or
      re-activating existing cards does NOT count. Guardrail enforced by
      check-session-log.py (check_new_anki_cards): a value > 10 FAILs the
      commit. Absent/0 on pre-QR-R3 logs, which passes.

  new_grammar_concepts_introduced:
    type: list
    required: false
    default: []
    description: |
      QR-R3: Grammar concept IDs (skill-map keys, e.g. A-02-ser-vs-estar)
      introduced for the first time this session. Consolidation/review of
      already-seen concepts does NOT belong here. Guardrail enforced by
      check-session-log.py (check_new_grammar_concepts): length > 1 FAILs the
      commit (CLAUDE.md "Never introduce more than 1 new grammar concept per
      session"). Empty/absent passes.

  next_session:
    type: map
    required: false
    default: null
    description: "Next session recommendation"
    children:
      recommended_focus:
        type: string
        required: false
        default: ""
        description: "What to focus on next"
      reason:
        type: string
        required: false
        default: ""
        description: "Why this focus was chosen"
      avoid:
        type: string
        required: false
        default: ""
        description: "What NOT to do tomorrow and why"
      session_type:
        type: string
        required: false
        default: ""
        description: "normal, consolidation, light-review, push-forward, fun-day"
      estimated_duration:
        type: int
        required: false
        default: 0
        description: "Estimated duration in minutes"
      l1_interference_to_preempt:
        type: list
        required: false
        default: []
        description: "Predicted transfer errors to address proactively"
