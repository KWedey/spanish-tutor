# Schema: Session Log
# Source: docs/system-design.md section 5
# This file is the authoritative schema for state/sessions/YYYY-MM-DD.yaml.
# Scripts read this file to validate and generate templates.

fields:
  date:
    type: string
    required: true
    default: ""
    description: "Session date (YYYY-MM-DD)"

  session_number:
    type: int
    required: true
    default: 0
    description: "Sequential session number"

  duration_minutes:
    type: int
    required: true
    default: 0
    description: "Total session duration in minutes"

  learner_energy:
    type: string
    required: false
    default: ""
    description: "high, medium, low (self-reported or inferred)"

  session_type:
    type: string
    required: true
    default: ""
    description: "Session type"
    enum: ["standard", "micro", "weekly-review", "phase-transition", "return", "first-session", "onboarding", "sprint", "fluency"]

  session_status:
    type: string
    required: true
    default: "complete"
    description: "Whether session completed normally"
    enum: ["complete", "partial", "aborted"]

  gap_days:
    type: int
    required: false
    default: 0
    description: "Days since last session (0 if consecutive)"

  assignment_review:
    type: list
    required: false
    default: []
    description: "How yesterday's homework went"

  input_reviewed:
    type: list
    required: false
    default: []
    description: "Input comprehension debrief entries"

  session_activities:
    type: list
    required: false
    default: []
    description: "Live session content activities"

  skill_map_updates:
    type: list
    required: false
    default: []
    description: "Assessment updates to apply to skill-map"

  interleaved_concepts:
    type: list
    required: false
    default: []
    description: "Prior concepts woven into primary concept practice"

  assignments:
    type: list
    required: false
    default: []
    description: "Homework assignments for before next session"

  journal_review:
    type: map
    required: false
    default: null
    description: "Journal entry review (if applicable)"
    children:
      entry_date:
        type: string
        required: false
        default: ""
        description: "Date of journal entry reviewed"
      errors_found:
        type: list
        required: false
        default: []
        description: "Errors found in journal entry"
      quality_notes:
        type: string
        required: false
        default: ""
        description: "Coherence, complexity, improvement from prior entries"

  learner_observations:
    type: map
    required: false
    default: null
    description: "Learner state observations"
    children:
      mood:
        type: string
        required: false
        default: ""
        description: "motivated, neutral, frustrated, tired, excited, anxious"
      engagement:
        type: string
        required: false
        default: ""
        description: "high, medium, low"
      emotional_state:
        type: string
        required: false
        default: ""
        description: "confident, uncertain, embarrassed, breakthrough-joy, struggling"
      self_assessment:
        type: string
        required: false
        default: ""
        description: "What they said about how they're feeling about progress"
      calibration_note:
        type: string
        required: false
        default: ""
        description: "If self-assessment diverges from actual performance"
      autonomy_readiness:
        type: string
        required: false
        default: ""
        description: "Observations about whether learner is ready for more control"

  assessment:
    type: map
    required: false
    default: null
    description: "Initial assessment (session 1 only, for non-beginners)"

  validation_checks:
    type: list
    required: false
    default: []
    description: "Placement validation spot-checks (sessions 2-4 only)"

  decision_engine_trace:
    type: map
    required: false
    default: null
    description: "Records why the tutor chose this session's focus — scoring details from concept selection"
    children:
      candidates_scored:
        type: int
        required: false
        default: 0
        description: "Number of concepts evaluated by the decision engine"
      top_candidates:
        type: list
        required: false
        default: []
        description: "Top-scoring candidates with individual dimension scores: {id, NEED, GAP, DECAY, TOPIC, VARIETY, TOTAL}"
      selected_primary:
        type: string
        required: false
        default: ""
        description: "Concept ID selected as primary focus"
      selected_secondary:
        type: string
        required: false
        default: ""
        description: "Concept ID selected as secondary focus"
      override_reason:
        type: string
        required: false
        default: null
        description: "Null unless manual override; record reason if so"

  session_difficulty_rating:
    type: string
    required: false
    default: null
    description: "Learner self-report at checkout"
    enum: [null, "too-easy", "just-right", "too-hard"]

  next_session:
    type: map
    required: false
    default: null
    description: "Next session recommendation"
    children:
      recommended_focus:
        type: string
        required: false
        default: ""
        description: "What to focus on next"
      reason:
        type: string
        required: false
        default: ""
        description: "Why this focus was chosen"
      avoid:
        type: string
        required: false
        default: ""
        description: "What NOT to do tomorrow and why"
      session_type:
        type: string
        required: false
        default: ""
        description: "normal, consolidation, light-review, push-forward, fun-day"
      estimated_duration:
        type: int
        required: false
        default: 0
        description: "Estimated duration in minutes"
      l1_interference_to_preempt:
        type: list
        required: false
        default: []
        description: "Predicted transfer errors to address proactively"
