# Schema: System Health
# Source: docs/system-design.md section 8
# This file is the authoritative schema for state/system-health.yaml.
# Scripts read this file to validate and generate templates.

fields:
  schema_version:
    type: int
    required: true
    default: 1
    description: "Schema version number"

  concepts_requiring_reteach_total:
    type: int
    required: true
    default: 0
    description: "High value = bad sequencing or premature advancement"

  average_sessions_to_acquire:
    type: int
    required: true
    default: 0
    description: "Trending up = something wrong"

  reteach_rate_30d:
    type: float
    required: true
    default: 0.0
    description: "Percent of concepts that regressed after being acquired"

  homework_completion_rate_30d:
    type: float
    required: true
    default: 0.0
    description: "Below 60% = overloaded or wrong type"

  homework_reported_difficulty_avg:
    type: float
    required: true
    default: 0.0
    description: "Should hover around 3/5"

  assignment_skip_patterns:
    type: list
    required: false
    default: []
    description: "Which assignment types get skipped most"

  days_in_current_phase:
    type: int
    required: true
    default: 0
    description: "Days spent in current phase"

  concepts_acquired_per_month:
    type: int
    required: true
    default: 0
    description: "Trending down = plateau or pacing issue"

  concepts_in_practicing_simultaneously:
    type: int
    required: true
    default: 0
    description: "Should stay <= 2"

  average_session_duration_30d:
    type: int
    required: true
    default: 0
    description: "Average session duration in minutes over 30 days"

  session_frequency_30d:
    type: float
    required: true
    default: 0.0
    description: "Sessions per week"

  learner_initiated_topics_30d:
    type: int
    required: true
    default: 0
    description: "Are they bringing their own questions?"

  sessions_rated_too_easy_30d:
    type: int
    required: true
    default: 0
    description: "Sessions rated too-easy in last 30 days"

  sessions_rated_too_hard_30d:
    type: int
    required: true
    default: 0
    description: "Sessions rated too-hard in last 30 days"

  anki_estimated_deck_size:
    type: int
    required: true
    default: 0
    description: "Estimated total Anki deck size"

  anki_estimated_daily_review_minutes:
    type: int
    required: true
    default: 0
    description: "Estimated daily Anki review time in minutes"

  last_validation_issues:
    type: list
    required: false
    default: []
    description: "Issues found during last validation run"

  load_adjustments:
    type: list
    required: false
    default: []
    description: "Homework-load adjustment audit trail (LOAD-03/D-07/D-11). Appended by check-session-log.py on WARN-tier budget events and by the tutor on D-11 daily_target reductions; surfaced at weekly review for triage."
    item_shape:
      date:
        type: string
        required: false
        description: "YYYY-MM-DD of the event"
      level:
        type: string
        required: false
        description: "WARN (over daily_target) or the adjustment type (e.g. daily_target-reduction)"
      homework_sum:
        type: int
        required: false
        description: "Summed estimated_minutes of the session's assignments"
      daily_target:
        type: int
        required: false
        description: "daily_target at the time of the event"
      daily_maximum:
        type: int
        required: false
        description: "daily_maximum at the time of the event"
      today_stretch:
        type: int
        required: false
        description: "today_stretch at the time of the event"
      message:
        type: string
        required: false
        description: "Human-readable explanation"
      detected_by:
        type: string
        required: false
        description: "Source that wrote the entry (script:function or 'tutor')"

  placement_validation_metrics:
    type: map
    required: false
    default: null
    description: "Placement validation effectiveness (populated after validation period closes)"
    children:
      placement_level:
        type: string
        required: false
        default: null
        description: "Where the learner was placed"
      initial_confidence:
        type: string
        required: false
        default: null
        description: "high / medium / low"
      total_concepts_validated:
        type: int
        required: false
        default: 0
        description: "Number of concepts validated during placement"
      total_downgrades:
        type: int
        required: false
        default: 0
        description: "Number of concept downgrades during validation"
      final_assessment:
        type: string
        required: false
        default: null
        description: "placement-confirmed / placement-adjusted"
        enum: [null, "placement-confirmed", "placement-adjusted"]
      validation_completed:
        type: string
        required: false
        default: null
        description: "Date validation period closed"

  goal_tracking:
    type: map
    required: false
    default: null
    description: "Goal progress tracking"
    children:
      primary_goal_progress:
        type: string
        required: false
        default: ""
        description: "Qualitative: on-track / behind / ahead / at-risk"
      estimated_weeks_remaining:
        type: int
        required: false
        default: null
        description: "Rough estimate based on current acquisition rate and remaining concepts"
      concepts_remaining_for_next_phase:
        type: int
        required: false
        default: 0
        description: "Number of concepts still needed before phase transition"
      concepts_remaining_for_target_level:
        type: int
        required: false
        default: 0
        description: "Number of concepts still needed to reach target CEFR level"
      current_acquisition_rate:
        type: float
        required: false
        default: 0.0
        description: "Concepts acquired per week (30-day rolling average)"
      last_goal_review:
        type: string
        required: false
        default: null
        description: "Date of last weekly review goal check"
      milestone_progress:
        type: list
        required: false
        default: []
        description: "List of {goal, status: pending|achieved|at-risk, target_date, notes}"

  session_difficulty_tracking:
    type: map
    required: false
    default: null
    description: "Tracks recent session difficulty ratings for calibration logic"
    children:
      last_rating:
        type: string
        required: false
        default: null
        description: "Most recent session difficulty rating"
        enum: [null, "too-easy", "just-right", "too-hard"]
      consecutive_too_easy:
        type: int
        required: false
        default: 0
        description: "Count of consecutive too-easy ratings (2+ triggers challenge increase)"
      consecutive_too_hard:
        type: int
        required: false
        default: 0
        description: "Count of consecutive too-hard ratings (2+ triggers load reduction)"
      recent_ratings:
        type: list
        required: false
        default: []
        description: "Last 5 session difficulty ratings for trend analysis"

  last_system_review:
    type: string
    required: false
    default: null
    description: "Date of last weekly review"
