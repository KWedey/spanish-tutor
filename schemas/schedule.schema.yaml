# Schema: Schedule
# Source: docs/system-design.md section 4
# This file is the authoritative schema for state/schedule.yaml.
# Scripts read this file to validate and generate templates.

fields:
  schema_version:
    type: int
    required: true
    default: 1
    description: "Schema version number"

  current_phase:
    type: string
    required: true
    default: "A-foundation"
    description: "Matches curriculum directory"
    enum: ["A-foundation", "B-conversational", "C-intermediate", "D-advanced"]

  current_week:
    type: int
    required: true
    default: 1
    description: "Current week number"

  onboarding_complete:
    type: bool
    required: true
    default: false
    description: "True after session 10 (decision engine activates)"

  current_onboarding_session:
    type: int
    required: false
    default: 1
    description: "Current onboarding session number (1-10). Agent reads this directly; incremented at end of each onboarding session."

  last_session_date:
    type: string
    required: false
    default: null
    description: "Date of most recent session (YYYY-MM-DD). Used for gap detection."

  autonomy_level:
    type: string
    required: false
    default: "guided"
    description: "guided, collaborative, learner-led, maintenance"
    enum: ["guided", "collaborative", "learner-led", "maintenance"]

  active_grammar:
    type: map
    required: false
    default: null
    description: "What grammar is being worked on right now"
    children:
      primary:
        type: string
        required: false
        default: ""
        description: "The main concept being learned"
      secondary:
        type: string
        required: false
        default: ""
        description: "A reinforcement concept from a prior level"
      maintenance:
        type: list
        required: false
        default: []
        description: "Acquired concepts due for spot-check"

  active_vocabulary:
    type: map
    required: false
    default: null
    description: "What vocabulary is being worked on right now"
    children:
      primary:
        type: string
        required: false
        default: ""
        description: "Current cluster being built"
      review:
        type: list
        required: false
        default: []
        description: "Clusters in SRS maintenance"

  active_pronunciation:
    type: map
    required: false
    default: null
    description: "Current pronunciation focus"
    children:
      focus:
        type: string
        required: false
        default: ""
        description: "Current target sound or pattern"

  active_writing:
    type: map
    required: false
    default: null
    description: "Current writing track"
    children:
      current_level:
        type: string
        required: false
        default: ""
        description: "sentence, paragraph, structured, extended"
      journal_active:
        type: bool
        required: false
        default: false
        description: "Whether daily journal entries are assigned"

  weekly_topic:
    type: map
    required: false
    default: null
    description: "Narrow input - weekly topic for content immersion"
    children:
      topic:
        type: string
        required: false
        default: ""
        description: "e.g., immigration in Latin America"
      vocabulary_cluster:
        type: string
        required: false
        default: ""
        description: "Which vocab cluster this reinforces"
      grammar_reinforcement:
        type: string
        required: false
        default: ""
        description: "Which grammar concept gets extra context"
      started:
        type: string
        required: false
        default: ""
        description: "Date this topic block started"

  fluency_accuracy_balance:
    type: string
    required: true
    default: "accuracy-leaning"
    description: "accuracy-leaning, balanced, fluency-leaning"
    enum: ["accuracy-leaning", "balanced", "fluency-leaning"]

  fluency_days_this_week:
    type: int
    required: false
    default: 0
    description: "Number of fluency days used this week"

  last_fluency_day:
    type: string
    required: false
    default: null
    description: "Date of last fluency day"

  grammar_queue:
    type: list
    required: false
    default: []
    description: "What grammar is next when current items are acquired"

  vocabulary_queue:
    type: list
    required: false
    default: []
    description: "What vocabulary is next when current clusters are acquired"

  sprint:
    type: map
    required: false
    default: null
    description: "Sprint mode - temporary reprioritization for a deadline"
    children:
      active:
        type: bool
        required: false
        default: false
        description: "Whether sprint mode is active"
      goal:
        type: string
        required: false
        default: ""
        description: "e.g., travel to Mexico City"
      target_date:
        type: string
        required: false
        default: ""
        description: "Sprint deadline"
      focus_areas:
        type: list
        required: false
        default: []
        description: "What to prioritize during sprint"

  carryover_concepts:
    type: list
    required: false
    default: []
    description: "Concepts from prior phase still in active practice"

  anki_new_cards_per_session:
    type: int
    required: false
    default: 8
    description: "SRS new cards per session"

  anki_retirement_threshold_days:
    type: int
    required: false
    default: 60
    description: "Days after which cards are retired"

  session_number:
    type: int
    required: false
    default: 0
    description: "Current session number (sequential counter across all sessions)"

  topic_history:
    type: list
    required: false
    default: []
    description: "List of {topic_id, week, date_started} — tracks which weekly narrow topics have been used and when, for FRESHNESS scoring in the decision engine"

  placement_validation:
    type: map
    required: false
    default: null
    description: "Placement validation state (active during sessions 2-4 for learners who skip onboarding)"
    children:
      active:
        type: bool
        required: false
        default: false
        description: "Whether placement validation is currently active"
      confidence:
        type: string
        required: false
        default: null
        description: "high / medium / low / validated"
        enum: [null, "high", "medium", "low", "validated"]
      sessions_completed:
        type: int
        required: false
        default: 0
        description: "Number of validation sessions completed"
      listening_baseline_set:
        type: bool
        required: false
        default: false
        description: "Whether the listening baseline has been established"
      total_downgrades:
        type: int
        required: false
        default: 0
        description: "Number of concept downgrades during validation"
      queue:
        type: list
        required: false
        default: []
        description: "Validation queue — populated during session 1 for Early B+ placements. Each entry: {concept_id, priority, status, checked_in_session, notes}"

  adjustment_log:
    type: list
    required: false
    default: []
    description: "Log of schedule adjustments"

  study_time_budget:
    type: map
    required: false
    default: null
    description: "D-04/LOAD-07: Homework-only time budget. Null at init; populated at first-session. Required after session 1. Renamed from REQUIREMENTS.md LOAD-07 'available_daily_study_time' per D-04."
    children:
      daily_minimum:
        type: int
        required: false
        default: null
        description: "D-05: Minimum daily homework minutes — SLA floor for progression. Strawman default 15."
      daily_target:
        type: int
        required: false
        default: null
        description: "D-05: Default daily assignment budget on a normal day. Adaptive via D-11 tiered rule. Strawman default 30."
      daily_maximum:
        type: int
        required: false
        default: null
        description: "D-05: Hard ceiling; check-session-log.py FAILs if homework sum > daily_maximum + today_stretch. Strawman default 60."
      weekly_goal:
        type: int
        required: false
        default: null
        description: "D-05: Weekly total target; informs weekly review. Strawman default 180."
      today_stretch:
        type: int
        required: false
        default: 0
        description: "D-04: Ephemeral per-session extension above daily_maximum. Reset to 0 by post-session.sh Step 5c. Default 0."

  consecutive_too_much_count:
    type: int
    required: false
    default: 0
    description: "D-11: Count of consecutive 'too-much' homework_load_rating ratings. Incremented at post-session; reset after daily_target reduction or on non-'too-much' rating."

  consecutive_just_right_count:
    type: int
    required: false
    default: 0
    description: "D-11: For restoration logic. 3+ consecutive 'just-right' after reduction → +10% daily_target."
