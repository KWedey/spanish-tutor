# Schema: Skill Map
# Source: docs/system-design.md section 3
# This file is the authoritative schema for state/skill-map.yaml.
# Scripts read this file to validate and generate templates.
#
# Structure convention: Unlike other schemas that use a flat `fields:` wrapper,
# the skill-map schema uses named entry templates (grammar_entry_template,
# vocabulary_entry_template, etc.) because the skill-map file contains
# repeating entries under category keys (grammar, vocabulary, pronunciation,
# writing, cultural_awareness). Each template defines the per-entry fields.
# Top-level non-repeating sections (receptive_skills, fluency_metrics,
# overall_estimates) are defined inline. The full file structure is assembled
# by init-student.py using these templates.

schema_version:
  type: int
  required: true
  default: 1
  description: "Schema version number"

grammar_entry_template:
  status:
    type: string
    required: true
    default: "unseen"
    description: "Current mastery status"
    enum: ["unseen", "introduced", "practicing", "acquired", "automatic", "regressed"]
  introduced_date:
    type: string
    required: false
    default: null
    description: "Date concept was first introduced"
  last_practiced:
    type: string
    required: false
    default: null
    description: "Date of most recent practice"
  practice_count:
    type: int
    required: true
    default: 0
    description: "Total times actively practiced"
  error_rate_drills:
    type: float
    required: false
    default: null
    description: "Rolling avg over last 5 drill instances"
  error_rate_production:
    type: float
    required: false
    default: null
    description: "Rolling avg over last 5 free production instances"
  error_trend:
    type: string
    required: false
    default: null
    description: "improving, stable, declining (based on production rate)"
    enum: [null, "improving", "stable", "declining"]
  performance_scaffolded:
    type: string
    required: false
    default: null
    description: "null (untested), struggling, competent"
    enum: [null, "struggling", "competent"]
  performance_unscaffolded:
    type: string
    required: false
    default: null
    description: "null (untested), struggling, competent"
    enum: [null, "struggling", "competent"]
  integration_tested_with:
    type: list
    required: false
    default: []
    description: "List of concept IDs tested in combination"
  prerequisites:
    type: list
    required: true
    default: []
    description: "Concept IDs that must be acquired first"
  notes:
    type: string
    required: false
    default: ""
    description: "Free-text notes"
  learner_interest:
    type: map
    required: false
    default: null
    description: "D-01/D-03: tutor-inferred interest score with provenance. Stale after 28 days."
    children:
      score:
        type: int
        required: false
        default: 0
        description: "0-3 interest score. Out-of-range = validator FAIL."
      last_inferred:
        type: string
        required: false
        default: null
        description: "YYYY-MM-DD of last inference. Stale decay: > 28 days ago treated as 0."
      signal_source:
        type: string
        required: false
        default: null
        description: "Why this score was set"
        enum: [null, "parking-lot", "debrief", "spontaneous-q", "engagement", "stale"]
  recast_uptake_stats:
    type: map
    required: false
    default: null
    description: "D-07: aggregate of recasts[] entries from session logs. Invariant: landed + missed + partial <= recasts_given."
    children:
      recasts_given:
        type: int
        required: false
        default: 0
        description: "Total recasts issued for this concept across sessions"
      landed:
        type: int
        required: false
        default: 0
        description: "Recasts where learner incorporated corrected form"
      missed:
        type: int
        required: false
        default: 0
        description: "Recasts where learner did not incorporate corrected form"
      partial:
        type: int
        required: false
        default: 0
        description: "Recasts where learner partially incorporated corrected form"
      last_updated:
        type: string
        required: false
        default: null
        description: "YYYY-MM-DD of last aggregation from session logs"
  regression_session_count:
    type: int
    required: false
    default: 0
    description: "D-09/ENGINE-05: consecutive sessions in regression since last acquired/automatic status. Incremented by post-session.sh. Used by Step 0c regression escalation ladder to determine escalation stage."

vocabulary_entry_template:
  status:
    type: string
    required: true
    default: "unseen"
    description: "Current mastery status"
    enum: ["unseen", "introduced", "practicing", "acquired", "automatic", "regressed"]
  words_total:
    type: int
    required: false
    default: 0
    description: "Populated from curriculum file"
  words_introduced:
    type: int
    required: false
    default: 0
    description: "Number of words introduced so far"
  passive_known:
    type: int
    required: false
    default: 0
    description: "Can recognize in reading/listening"
  active_known:
    type: int
    required: false
    default: 0
    description: "Can produce in speaking/writing"
  weak_production:
    type: list
    required: false
    default: []
    description: "Recognize but cannot produce"
  weak_recognition:
    type: list
    required: false
    default: []
    description: "Cannot recognize at all"
  last_practiced:
    type: string
    required: false
    default: null
    description: "Date of most recent practice"
  notes:
    type: string
    required: false
    default: ""
    description: "Free-text notes"
  error_tracking:
    type: map
    required: false
    default: null
    description: "Production error tracking for this cluster"
    children:
      error_rate_production:
        type: float
        required: false
        default: null
        description: "Rolling avg, last 5 in-session observations"
      common_errors:
        type: list
        required: false
        default: []
        description: "e.g., gender: el mano -> la mano"
      last_observed:
        type: string
        required: false
        default: null
        description: "Date of last in-session production observation"
  learner_interest:
    type: map
    required: false
    default: null
    description: "D-01/D-03: tutor-inferred interest score with provenance. Stale after 28 days."
    children:
      score:
        type: int
        required: false
        default: 0
        description: "0-3 interest score. Out-of-range = validator FAIL."
      last_inferred:
        type: string
        required: false
        default: null
        description: "YYYY-MM-DD of last inference. Stale decay: > 28 days ago treated as 0."
      signal_source:
        type: string
        required: false
        default: null
        description: "Why this score was set"
        enum: [null, "parking-lot", "debrief", "spontaneous-q", "engagement", "stale"]

