    enum: ["unseen", "introduced", "practicing", "acquired"]
  introduced_at_phase:
    type: string
    required: true
    default: "B"
    description: "Phase when this concept is introduced"
  assessed_through:
    type: string
    required: false
    default: ""
    description: "How this concept is assessed"
  signs_of_acquisition:
    type: string
    required: false
    default: ""
    description: "Observable indicators of acquisition"
  notes:
    type: string
    required: false
    default: ""
    description: "Free-text notes"
  learner_interest:
    type: map
    required: false
    default: null
    description: "D-01/D-03: tutor-inferred interest score with provenance. Stale after 28 days."
    children:
      score:
        type: int
        required: false
