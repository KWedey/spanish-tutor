  status:
    type: string
    required: true
    default: "unseen"
    description: "Current mastery status"
    enum: ["unseen", "introduced", "practicing", "acquired", "automatic", "regressed"]
  last_practiced:
    type: string
    required: false
    default: null
    description: "Date of most recent practice"
  external_feedback:
    type: string
    required: false
    default: ""
    description: "Latest from Speechling or conversation partner"
  notes:
    type: string
    required: false
    default: ""
    description: "Free-text notes"

writing_entry_template:
  status:
    type: string
    required: true
    default: "unseen"
    description: "Current mastery status"
    enum: ["unseen", "introduced", "practicing", "acquired"]
  last_practiced:
    type: string
    required: false
    default: null
    description: "Date of most recent practice"
  notes:
    type: string
    required: false
    default: ""
    description: "Free-text notes"

receptive_skills:
  listening:
    type: map
    required: false
    default: null
    description: "Listening comprehension tracking"
    children:
      current_level:
        type: string
        required: false
        default: "L1"
        description: "L1-L5 scale"
        enum: ["L1", "L2", "L3", "L4", "L5"]
      comprehension_quality:
        type: string
        required: false
        default: null
        description: "gist / main_ideas / details / inference"
        enum: [null, "gist", "main_ideas", "details", "inference"]
      hours_at_level:
        type: float
        required: false
        default: 0
        description: "Hours of input at current level"
      hours_total:
        type: float
        required: false
        default: 0
        description: "Cumulative listening input hours"
      level_up_evidence:
        type: list
        required: false
        default: []
        description: "Dated observations supporting level advancement"
      level_history:
        type: list
        required: false
        default: []
        description: "History of level changes"
  reading:
    type: map
    required: false
    default: null
    description: "Reading comprehension tracking"
    children:
      current_level:
        type: string
        required: false
        default: "R1"
        description: "R1-R5 scale"
        enum: ["R1", "R2", "R3", "R4", "R5"]
      comprehension_quality:
        type: string
        required: false
        default: null
        description: "gist / main_ideas / details / inference"
        enum: [null, "gist", "main_ideas", "details", "inference"]
      lookup_frequency:
        type: string
        required: false
        default: "frequent"
        description: "frequent / occasional / rare / none"
        enum: ["frequent", "occasional", "rare", "none"]
      hours_at_level:
        type: float
        required: false
        default: 0
        description: "Hours of input at current level"
      hours_total:
        type: float
        required: false
        default: 0
        description: "Cumulative reading input hours"
      level_up_evidence:
        type: list
        required: false
        default: []
        description: "Dated observations supporting level advancement"
      level_history:
        type: list
        required: false
        default: []
        description: "History of level changes"

