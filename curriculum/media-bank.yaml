music:
  - artist: Alvaro Soler
    region: peninsular
    phase_range: [A, B]
    topic_alignment: [my-daily-routine, weekend-plans-and-activities]
    songs: ["Sofía", "El Mismo Sol", "La Cintura"]
    notes: "Clear, slow pop lyrics. Feel-good. Great for Phase A."
  - artist: Jesse y Joy
    region: mexican
    phase_range: [A, B]
    topic_alignment: [emotions-and-relationships, childhood-and-family]
    songs: ["Corre", "Me Voy", "Llorar"]
    notes: "Clear vocals, simple structures. Emotional but accessible."
  - artist: Juanes
    region: colombian
    phase_range: [A, B]
    topic_alignment: [emotions-and-relationships, opinions-and-debate]
    songs: ["A Dios le Pido", "La Camisa Negra", "Fotografía"]
    notes: "Clear pronunciation, moderate tempo. Accessible for beginners."
  - artist: Shakira
    region: colombian
    phase_range: [A, B, C]
    topic_alignment: [emotions-and-relationships]
    songs: ["Waka Waka", "Loba", "Antes de las Seis"]
    notes: "Mix of simple and complex. Prefer Spanish-only tracks."
  - artist: Manu Chao
    region: mixed_latin
    phase_range: [B, C]
    topic_alignment: [travel-and-culture, current-events-and-society]
    songs: ["Me Gustas Tú", "Clandestino", "Bongo Bong"]
    notes: "Repetitive choruses, clear diction. 'Me Gustas Tú' is a vocab goldmine."
  - artist: Natalia Lafourcade
    region: mexican
    phase_range: [B, C]
    topic_alignment: [emotions-and-relationships, childhood-and-family, travel-and-culture]
    songs: ["Hasta la Raíz", "Tú Sí Sabes Quererme", "Nunca Es Suficiente"]
    notes: "Beautiful clear vocals. Poetic but accessible. Great for lyric study."
  - artist: Calle 13 / Residente
    region: puerto_rican
    phase_range: [C, D]
    topic_alignment: [current-events-and-society, opinions-and-debate, humor-idioms-and-slang]
    songs: ["Latinoamérica", "Atrévete-te-te", "El Aguante"]
    notes: "Rapid-fire lyrics, social commentary. Advanced vocabulary."
  - artist: Rosalía
    region: peninsular
    phase_range: [C, D]
    topic_alignment: [emotions-and-relationships, humor-idioms-and-slang]
    songs: ["Malamente", "Bizcochito", "De Aquí No Sales"]
    notes: "Flamenco-pop fusion. Slang-heavy, fast. Advanced cultural immersion."
  - artist: Jorge Drexler
    region: uruguayan
    phase_range: [C, D]
    topic_alignment: [philosophy-and-big-ideas, emotions-and-relationships, telling-stories]
    songs: ["Todo Se Transforma", "Movimiento", "Telefonía"]
    notes: "Poetic, thoughtful lyrics. Excellent for literary Spanish."
  - artist: Bad Bunny
    region: puerto_rican
    phase_range: [C, D]
    topic_alignment: [humor-idioms-and-slang, current-events-and-society]
    songs: ["Callaíta", "Dakiti", "Yonaguni"]
    notes: "Reggaeton/trap. Heavy slang, elision. Good for informal register."

books:
  - title: Short Stories in Spanish for Beginners (Olly Richards)
    type: graded_reader
    phase_range: [A, B]
    cefr: [A2, B1]
    topic_alignment: [telling-stories, my-daily-routine, a-memorable-trip]
    notes: "8 stories with glossaries. Primary Phase A reading resource."
  - title: Practice Makes Perfect — Spanish Reading and Comprehension
    type: graded_reader
    phase_range: [A, B]
    cefr: [A1, A2, B1]
    topic_alignment: [my-daily-routine, food-and-eating-out, getting-around-town]
    notes: "Textbook-style graded readings with exercises."
  - title: Short Stories in Spanish for Intermediate Learners (Olly Richards)
    type: graded_reader
    phase_range: [B, C]
    cefr: [B1, B2]
    topic_alignment: [telling-stories, travel-and-culture, emotions-and-relationships]
    notes: "Step up from beginner volume. Longer stories, less hand-holding."
  - title: El Principito (Antoine de Saint-Exupéry)
    type: adapted_classic
    phase_range: [B, C]
    cefr: [B1]
    topic_alignment: [philosophy-and-big-ideas, childhood-and-family, emotions-and-relationships]
    notes: "Simple prose, deep themes. Bilingual editions available. Phase B stretch."
  - title: Cajas de Cartón (Francisco Jiménez)
    type: authentic_literature
    phase_range: [B, C]
    cefr: [B1, B2]
    topic_alignment: [childhood-and-family, work-and-career, a-memorable-trip]
    notes: "Autobiographical stories. Simple language, powerful content."
  - title: Crónica de una Muerte Anunciada (Gabriel García Márquez)
    type: authentic_literature
    phase_range: [C, D]
    cefr: [B2, C1]
    topic_alignment: [telling-stories, current-events-and-society]
    notes: "Short novel (~120 pages). Good first authentic novel."
  - title: Como Agua para Chocolate (Laura Esquivel)
    type: authentic_literature
    phase_range: [C, D]
    cefr: [B2, C1]
    topic_alignment: [food-and-eating-out, childhood-and-family, emotions-and-relationships]
    notes: "Mexican magical realism. Food and family. Rich but accessible."
  - title: La Sombra del Viento (Carlos Ruiz Zafón)
    type: authentic_literature
    phase_range: [D]
    cefr: [C1]
    topic_alignment: [telling-stories, philosophy-and-big-ideas, emotions-and-relationships]
    notes: "Gothic mystery in Barcelona. Beautiful prose. Challenging capstone read."
