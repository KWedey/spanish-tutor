# Media Bank — Specific content recommendations for homework and immersion
# Organized by type, phase, and dialect. Tutor selects based on current topic and level.
# Cross-references topic-bank.yaml for alignment and resource-catalog.yaml for tool pairing.

youtube_channels:
  - name: Dreaming Spanish
    dialect: mixed
    phase_range: [A, B, C]
    levels: [superbeginner, beginner, intermediate, advanced]
    topic_alignment: [all]
    notes: "Primary comprehensible input. 2000+ videos. Assign daily."
  - name: Easy Spanish
    dialect: mixed
    phase_range: [A, B, C]
    topic_alignment: [food-and-eating-out, travel-and-culture, opinions-and-debate]
    notes: "Street interviews with subtitles. Real accents and natural speech."
  - name: SpanishPod101
    dialect: neutral
    phase_range: [A, B]
    topic_alignment: [greetings-and-introductions, my-daily-routine, food-and-eating-out]
    notes: "Structured grammar lessons. Can feel classroom-like — use sparingly."
  - name: Why Not Spanish
    dialect: colombian
    phase_range: [A, B, C]
    topic_alignment: [childhood-and-family, emotions-and-relationships, humor-idioms-and-slang]
    notes: "Colombian couple. Natural, fun. Good cultural exposure and colloquial speech."
  - name: Butterfly Spanish
    dialect: mexican
    phase_range: [A, B]
    topic_alignment: [greetings-and-introductions, describing-people-and-things, my-daily-routine]
    notes: "Clear Mexican accent. Strong grammar explanations for visual learners."
  - name: Español con Juan
    dialect: peninsular
    phase_range: [B, C]
    topic_alignment: [opinions-and-debate, telling-stories, philosophy-and-big-ideas]
    notes: "Entirely in Spanish. Whiteboard grammar with storytelling. Phase B+ only."
  - name: Hola Spanish
    dialect: colombian
    phase_range: [A, B]
    topic_alignment: [getting-around-town, shopping-and-money, food-and-eating-out]
    notes: "Practical scenario-based lessons. Good for travel topics."
  - name: SpanishWithPaul
    dialect: peninsular
    phase_range: [A, B]
    topic_alignment: [greetings-and-introductions, my-daily-routine, describing-people-and-things]
    notes: "Highly structured course format. Systematic progression."
  - name: Superholly
    dialect: mexican
    phase_range: [B, C, D]
    topic_alignment: [humor-idioms-and-slang, current-events-and-society, opinions-and-debate]
    notes: "Bilingual Mexican creator. Culture, humor. Authentic fast speech."
  - name: Academia Play
    dialect: peninsular
    phase_range: [C, D]
    topic_alignment: [current-events-and-society, philosophy-and-big-ideas]
    notes: "Animated history/science in Spanish. Dense. Phase C+ content immersion."

podcasts:
  - name: News in Slow Spanish
    dialect: peninsular
    editions: [Latino, Peninsular]
    phase_range: [A, B, C]
    topic_alignment: [current-events-and-society, opinions-and-debate]
    notes: "Graded speed. Two editions. Bridge to native-speed content."
  - name: Radio Ambulante
    dialect: mixed_latin_american
    phase_range: [C, D]
    topic_alignment: [telling-stories, current-events-and-society, travel-and-culture]
    notes: "NPR-quality narrative journalism. Full transcripts. Phase C+ only."
  - name: Duolingo Spanish Podcast
    dialect: mixed_latin_american
    phase_range: [A, B]
    topic_alignment: [childhood-and-family, a-memorable-trip, telling-stories]
    notes: "Bilingual format — English narrator, Spanish story. Perfect Phase A-B bridge."
  - name: Notes in Spanish
    dialect: peninsular
    phase_range: [A, B, C]
    topic_alignment: [my-daily-routine, opinions-and-debate, emotions-and-relationships]
    notes: "British-Spanish couple. Three tiers: Beginners, Intermediate, Advanced."
  - name: Coffee Break Spanish
    dialect: peninsular
    phase_range: [A, B]
    topic_alignment: [greetings-and-introductions, getting-around-town, food-and-eating-out]
    notes: "Structured lessons with native speakers. Strong Phase A resource."
  - name: Hoy Hablamos
    dialect: peninsular
    phase_range: [B, C]
    topic_alignment: [humor-idioms-and-slang, my-daily-routine, opinions-and-debate]
    notes: "Daily short episodes with transcripts. Good for building a listening habit."
  - name: Españolistos
    dialect: colombian
    phase_range: [B, C]
    topic_alignment: [emotions-and-relationships, work-and-career, childhood-and-family]
    notes: "American-Colombian couple. Natural conversations with vocab explanations."
  - name: No Hay Tos
    dialect: mexican
    phase_range: [B, C, D]
    topic_alignment: [humor-idioms-and-slang, comparing-cities-and-countries, travel-and-culture]
    notes: "Mexican-American duo. Slang, idioms, cultural contrasts."
  - name: El Hilo
    dialect: mixed_latin_american
    phase_range: [C, D]
    topic_alignment: [current-events-and-society, professional-communication]
    notes: "Weekly deep-dive Latin American journalism. Challenging but rewarding."
  - name: Cuentos de Hadas
    dialect: neutral
    phase_range: [A, B]
    topic_alignment: [telling-stories, childhood-and-family]
    notes: "Fairy tales narrated slowly. Low-pressure beginner listening."

