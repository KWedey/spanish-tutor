# Prescriptive episodes — specific content for L2-L3 assignments with summaries
# Content summaries enable informed comprehension debriefs.
# These must be human-authored (from episode descriptions or manual review).
# The tutor cannot generate summaries — it cannot watch/listen to content.
# Add entries incrementally as resources enter regular rotation.

prescriptive_episodes:
  listening:
    - source: Dreaming Spanish
      title: "Super Beginner — Mi rutina diaria"
      level: L2
      dialect: neutral_latam
      duration_minutes: 7
      topic_alignment: [my-daily-routine]
      content_summary: >
        Speaker acts out a complete morning routine using present tense.
        Key vocabulary: despertarse, levantarse, ducharse, vestirse, desayunar,
        salir de casa. Heavily visual with each action demonstrated physically.
        Simple sentence structure: "Primero me despierto. Después me levanto."

    - source: Dreaming Spanish
      title: "Super Beginner — Mi familia"
      level: L2
      dialect: neutral_latam
      duration_minutes: 6
      topic_alignment: [childhood-and-family]
      content_summary: >
        Speaker introduces family members using photos/drawings. Key vocabulary:
        madre, padre, hermano, hermana, abuelo, abuela, tío, tía. Uses ser for
        descriptions ("Mi madre es alta") and tener for age ("Mi hermano tiene
        veinte años"). Slow, clear, repetitive.

    - source: Dreaming Spanish
      title: "Beginner — Qué hago los fines de semana"
      level: L2
      dialect: neutral_latam
      duration_minutes: 9
      topic_alignment: [weekend-plans-and-activities]
      content_summary: >
        Speaker describes weekend activities with visual support. Key vocabulary:
        ir al parque, cocinar, leer, ver películas, salir con amigos. Uses gustar
        construction ("Me gusta cocinar") and ir + a + infinitive for plans.
        Moderate visual support, slightly less repetitive than Super Beginner.

    - source: News in Slow Spanish
      title: "Weekly News — sample beginner episode"
      level: L2
      dialect: peninsular
      duration_minutes: 10
      topic_alignment: [current-events-and-society]
      content_summary: >
        Current events presented at reduced speed with simplified vocabulary.
        Each story is 2-3 minutes. Grammar structures are present tense dominant.
        Useful for building news vocabulary: país, gobierno, personas, problema.
        Peninsular pronunciation and vocabulary.

    - source: Duolingo Spanish Podcast
      title: "Sample beginner episode"
      level: L2
      dialect: mixed_latin_american
      duration_minutes: 20
      topic_alignment: [telling-stories, childhood-and-family]
      content_summary: >
        Bilingual format — English narrator provides context, Spanish speaker
        tells personal story. The Spanish segments use past tense (preterite/
        imperfect) but at slow, clear pace with context from English framing.
        Good for passive exposure to past tense before formal introduction.

    - source: Coffee Break Spanish
      title: "Sample lesson episode"
      level: L2
      dialect: peninsular
      duration_minutes: 20
      topic_alignment: [greetings-and-introductions, getting-around-town]
      content_summary: >
        Structured lesson with native speaker. Introduces situational vocabulary
        (greetings, directions, ordering) with repetition and explanation.
        Teacher-student format — the English-speaking host learns alongside listener.

    - source: Dreaming Spanish
      title: "Intermediate — Una historia de mi infancia"
      level: L3
      dialect: neutral_latam
      duration_minutes: 12
      topic_alignment: [childhood-and-family, telling-stories]
      content_summary: >
        Speaker narrates a childhood memory using past tenses. Key grammar:
        preterite for events ("Un día fui al parque"), imperfect for descriptions
        ("Hacía mucho calor"). Less visual support than Beginner — relies more
        on narrative context. Natural connectors: entonces, después, pero.

    - source: Dreaming Spanish
      title: "Intermediate — Comparando ciudades"
      level: L3
      dialect: neutral_latam
      duration_minutes: 10
      topic_alignment: [comparing-cities-and-countries]
      content_summary: >
        Speaker compares two cities they've lived in. Key grammar: comparatives
        (más...que, menos...que, tan...como), ser vs estar for city descriptions.
        Moderate speed, some natural filler words (bueno, pues, o sea). Good for
        opinion vocabulary: creo que, me parece, en mi opinión.

    - source: Easy Spanish
      title: "Street interview sample — ¿Qué comes normalmente?"
      level: L3
      dialect: mixed
      duration_minutes: 8
      topic_alignment: [food-and-eating-out]
      content_summary: >
        Street interviews with multiple speakers about eating habits. Varied
        accents and speaking speeds. Subtitles available. Key vocabulary: comida,
        desayuno, almuerzo, cena, cocinar, restaurante. Some speakers are fast —
        subtitles help. Good exposure to natural speech variety.

    - source: Españolistos
      title: "Sample conversation episode"
      level: L3
      dialect: colombian
      duration_minutes: 25
      topic_alignment: [emotions-and-relationships]
      content_summary: >
        American-Colombian couple discusses a relationship topic naturally.
        Vocabulary explanations embedded in conversation (Andrea explains Colombian
        expressions to her husband). Moderate pace, natural back-and-forth.
        Good model for conversational rhythm and back-channeling.

  # Reading entries — graded readers (R2) through transition titles (R3) to
  # authentic short fiction (R4). Summaries written from publicly-available
  # book descriptions, blurbs, and reviewer notes — NOT from claiming to have
  # read the book (the tutor cannot generate summaries; see comment above the
  # prescriptive_episodes block).
  reading:
    - source: Olly Richards
      title: "Spanish Short Stories for Beginners (Vol 1) — Chapter 1: El Loco"
      level: R2
      cefr: A2
      dialect: neutral_latam
      chapter_range: "Chapter 1 (~25 pages, split into 3 sittings if needed)"
      topic_alignment: [telling-stories, describing-people-and-things, my-daily-routine]
      content_summary: >
        Beginner graded reader using ~1,000 most-common Spanish words. Each chapter
        is a self-contained short story written for learners (controlled vocabulary,
        repetition of new words, glossary at chapter end). Chapter 1 introduces a
        mystery in present and preterite tenses. Each chapter has a multiple-choice
        comprehension quiz appended — useful as debrief probes. Author writes for
        the learner, not native-speaker entertainment — pacing is intentionally slow.

    - source: Olly Richards
      title: "Spanish Short Stories for Intermediate Learners — Chapter 1: La Sociedad"
      level: R3
      cefr: B1
      dialect: neutral_latam
      chapter_range: "Chapter 1 (~30 pages, 1-2 sittings)"
      topic_alignment: [current-events-and-society, opinions-and-debate, philosophy-and-big-ideas]
      content_summary: >
        Intermediate graded reader continuing the Olly Richards series. Vocabulary
        expanded to ~2,000 most-common words; tenses include preterite, imperfect,
        present subjunctive (introduced gradually). Chapter 1 is a near-future
        fiction setting introducing societal themes — appropriate for B1 learners
        building from short narratives toward longer-form reading. End-of-chapter
        glossary and comprehension questions remain.

    - source: Antoine de Saint-Exupéry (trans. Spanish)
      title: "El Principito — Chapters 1-3"
      level: R3
      cefr: B1
      dialect: neutral
      chapter_range: "Chapters 1-3 (~15 pages)"
      topic_alignment: [philosophy-and-big-ideas, describing-people-and-things, childhood-and-family]
      content_summary: >
        Classic French novella translated into accessible Spanish. Short chapters
        (3-6 pages each) with simple syntax, present and imperfect dominant. Often
        used as the first authentic-literature read because the language is
        deliberately simple (the original is a children's book). Chapters 1-3
        establish the narrator, the encounter in the desert, and the prince's
        introduction. Recurring vocabulary: dibujo, planeta, serpiente, sombrero.
        Cultural/philosophical themes accessible without dialect-specific knowledge.

    - source: Francisco Jiménez
      title: "Cajas de Cartón — story 'Cajas de cartón'"
      level: R3
      cefr: B1
      dialect: mexican
      chapter_range: "First story (~12 pages)"
      topic_alignment: [childhood-and-family, work-and-career, a-memorable-trip]
      content_summary: >
        Autobiographical short-story collection by a Mexican-American author about
        his family's migrant farm-working life in California in the 1950s-60s.
        Title story tracks the family packing their cardboard boxes for the next
        move. First-person past narration, accessible vocabulary, emotionally
        weighted but linguistically straightforward. Strong Mexican Spanish flavor —
        useful for learners targeting es-MX. Each story is 10-15 pages, designed
        for classroom use (comprehension questions included in many editions).

    - source: Mario Benedetti
      title: "La muerte y otras sorpresas — story 'La noche de los feos'"
      level: R4
      cefr: B2
      dialect: rioplatense
      chapter_range: "Single story (~10 pages)"
      topic_alignment: [emotions-and-relationships, describing-people-and-things, telling-stories]
      content_summary: >
        Uruguayan short-story master. 'La noche de los feos' is a 10-page first-
        person narrative — two physically scarred strangers meet at a cinema and
        share an evening. Sparse, intimate prose; subjunctive and conditional
        appear naturally. **Voseo present** — useful target for es-AR / es-UY
        learners specifically; advisory needed for other Latin-American targets
        (see input-orchestration.md Section 1 Step 2 dialect re-filter). Strong
        literary register — first authentic-fiction step for learners moving past
        graded readers.

    - source: Isabel Allende
      title: "Cuentos de Eva Luna — story 'Dos palabras'"
      level: R4
      cefr: B2
      dialect: chilean
      chapter_range: "Single story (~15 pages)"
      topic_alignment: [telling-stories, opinions-and-debate, work-and-career]
      content_summary: >
        Chilean author writing in a magical-realist register. 'Dos palabras' opens
        the collection — Belisa Crepusculario sells words at country fairs and is
        recruited by a colonel to write him a speech. Rich descriptive vocabulary,
        preterite/imperfect contrast on display, occasional subjunctive. Less
        regionally marked than Benedetti — accessible to most Latin-American
        target_dialect learners. Stories are 12-20 pages each, designed for
        sequential reading but each stands alone.

    - source: Carmen Laforet
      title: "Nada — Chapter 1"
      level: R4
      cefr: B2
      dialect: peninsular
      chapter_range: "Chapter 1 (~25 pages)"
      topic_alignment: [childhood-and-family, my-home-and-neighborhood, emotions-and-relationships]
      content_summary: >
        Spanish post-war novel (1944). Chapter 1 introduces Andrea arriving in
        Barcelona to live with her grandmother's eccentric family. Vivid sensory
        prose, peninsular Spanish, **vosotros forms present** — advisory needed
        for non-peninsular target_dialect learners (see input-orchestration.md
        Section 1 Step 2 dialect re-filter). First chapter is self-contained
        enough to function as a standalone reading. Strong literary register —
