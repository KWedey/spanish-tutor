# L1 Interference Map — Predicted English-Spanish transfer errors
# Referenced by tutor during new concept introduction.
# See curriculum/tutor-guides/l1-interference-protocol.md for usage protocol.

interference_patterns:
  - id: ser-estar-confusion
    english_cause: "English has one verb 'to be'"
    common_errors:
      - wrong: "Soy cansado"
        right: "Estoy cansado"
        explanation: "Temporary states use estar"
      - wrong: "Esta un profesor"
        right: "Es un profesor"
        explanation: "Identity/profession uses ser"
    preempt_at: A-02-ser-vs-estar
    severity: high
    persistence: "Can fossilize permanently if not caught early"
    pre_instruction_recast: true  # recast gently in sessions 2-4 before formal instruction in session 5

  - id: adjective-placement
    english_cause: "English puts adjectives before nouns"
    common_errors:
      - wrong: "una roja casa"
        right: "una casa roja"
    preempt_at: A-03-gender-agreement
    severity: medium
    persistence: "Usually self-corrects with enough input"

  - id: subject-pronoun-overuse
    english_cause: "English requires subject pronouns"
    common_errors:
      - wrong: "Yo voy al mercado y yo compro..."
        right: "Voy al mercado y compro..."
        explanation: "Spanish drops subject pronouns when clear from conjugation"
    preempt_at: A-01-present-regular
    severity: medium
    persistence: "Common for months, resolves with immersion"

  - id: false-cognates
    english_cause: "Words that look similar but mean different things"
    common_errors:
      - wrong: "Estoy embarazada"
        intended: "I'm embarrassed"
        right: "Estoy avergonzada"
        explanation: "embarazada = pregnant"
      - wrong: "Quiero introducir mi amigo"
        intended: "I want to introduce my friend"
        right: "Quiero presentar a mi amigo"
        explanation: "introducir = to insert"
      - wrong: "Estoy constipado"
        intended: "I'm constipated"
        right: "Estoy estreñido"
        explanation: "constipado = having a cold"
    preempt_at: vocabulary-introduction  # Not a grammar concept ID — triggered when introducing new vocabulary clusters containing false cognates
    severity: high
    persistence: "Memorable once learned, but embarrassing if not"

  - id: preposition-mapping
    english_cause: "Prepositions don't map 1:1"
    common_errors:
      - wrong: "pensar sobre"
        right: "pensar en"
        explanation: "think about = pensar en"
      - wrong: "sonar sobre"
        right: "sonar con"
        explanation: "dream about = sonar con"
      - wrong: "depende en"
        right: "depende de"
        explanation: "depend on = depender de"
    preempt_at: A-04-articles-prepositions
    severity: medium
    persistence: "Long-lasting — requires memorization per verb"

  - id: hacer-for-weather
    english_cause: "English uses 'it is' for weather"
    common_errors:
      - wrong: "Es caliente afuera"
        right: "Hace calor afuera"
    preempt_at: tier2-weather-seasons  # Not a grammar concept ID — triggered when introducing the weather/seasons vocabulary cluster
    severity: low
    persistence: "Corrects quickly once taught"

  - id: negative-double-negative
    english_cause: "English avoids double negatives"
    common_errors:
      - wrong: "No tengo algo"
        right: "No tengo nada"
        explanation: "Spanish requires double negative"
    preempt_at: A-05-basic-questions
    severity: medium
    persistence: "Moderate — feels wrong to English speakers"

  - id: gustar-construction
    english_cause: "English 'I like X' vs Spanish 'X pleases me'"
    common_errors:
      - wrong: "Yo gusto el cafe"
        right: "Me gusta el cafe"
    preempt_at: A-06-gustar-type-verbs
    severity: high
    persistence: "Fossilizes quickly if not addressed immediately"

  - id: preterite-imperfect-overuse
    english_cause: "English past tense doesn't distinguish aspect"
    common_errors:
      - wrong: "Cuando fui nino..."
        right: "Cuando era nino..."
        explanation: "Habitual/background past = imperfect"
    preempt_at: B-04-preterite-vs-imperfect
    severity: high
    persistence: "The hardest B1 concept — takes months to internalize"

  - id: subjunctive-avoidance
    english_cause: "English rarely uses subjunctive"
    common_errors:
      - wrong: "Quiero que tu vienes"
        right: "Quiero que tu vengas"
        explanation: "Desire/wish + que = subjunctive"
    preempt_at: C-01-present-subjunctive
    severity: high
    persistence: "Very persistent — the biggest C1 hurdle"

  - id: progressive-overuse
    english_cause: "English overuses progressive for habitual actions"
    common_errors:
      - wrong: "Estoy comiendo mucho (for habitual)"
        right: "Como mucho (present simple for habits)"
        explanation: "Spanish progressive is for actions happening right now, not habitual actions"
    preempt_at: B-08-estar-gerund-progressive
    severity: medium
    persistence: "Moderate — resolves with exposure to natural Spanish input"

  - id: imperative-pronoun-placement
    english_cause: "English always puts pronouns before verbs"
    common_errors:
      - wrong: "Me di (pronoun before affirmative command)"
        right: "Dime (pronoun attaches to affirmative command)"
      - wrong: "No dime (pronoun attached to negative command)"
        right: "No me digas (pronoun precedes negative command)"
        explanation: "Affirmative commands: pronoun attaches. Negative commands: pronoun precedes."
    preempt_at: B-09-imperatives
    severity: medium
    persistence: "Takes several weeks of practice to automatize"

  - id: comparative-de-vs-que
    english_cause: "English uses 'than' for all comparisons"
    common_errors:
      - wrong: "Mas que cinco personas"
        right: "Mas de cinco personas"
        explanation: "Use 'de' before numbers, 'que' before nouns/clauses"
    preempt_at: B-10-comparatives-superlatives
    severity: low
    persistence: "Corrects quickly once the rule is explained"

  - id: indirect-speech-subjunctive
    english_cause: "English rarely changes mood in reported speech"
    common_errors:
      - wrong: "Me dijo que viene manana"
        right: "Me dijo que viniera manana"
        explanation: "Reported requests/desires require subjunctive in Spanish"
    preempt_at: C-08-indirect-speech
    severity: medium
    persistence: "Persistent — tied to broader subjunctive acquisition"

  - id: por-para-confusion
    english_cause: "English 'for' collapses two distinct Spanish prepositions (por = cause/exchange/duration/route; para = purpose/recipient/destination/deadline)"
    common_errors:
      - wrong: "Gracias para tu ayuda"
        right: "Gracias por tu ayuda"
        explanation: "Thanks for (motive/cause) uses por"
      - wrong: "Trabajo para tres horas"
        right: "Trabajo por tres horas"
        explanation: "Duration uses por"
      - wrong: "Este regalo es por ti"
        right: "Este regalo es para ti"
        explanation: "Recipient uses para"
    preempt_at: C-05-por-vs-para
    severity: high
    persistence: "Long-lasting — refined across every new context; notoriously difficult because English collapses two concepts into one word"

  - id: tener-for-age
    english_cause: "English uses 'to be' for age: 'I am 20 years old'"
    common_errors:
      - wrong: "Soy 20 años"
        right: "Tengo 20 años"
        explanation: "Spanish uses tener (to have) for age, not ser (to be)"
      - wrong: "Es caliente (he/she is hot — temperature)"
        right: "Tiene calor"
        explanation: "Physical states use tener, not ser/estar"
    preempt_at: A-08-numbers-quantifiers
    severity: high
    persistence: "Fossilizes quickly if not caught early — one of the first errors English speakers make"

  - id: quantifier-agreement
    english_cause: "English quantifiers are invariable ('many books', 'many houses' — 'many' never changes form)"
    common_errors:
      - wrong: "Mucho personas"
        right: "Muchas personas"
        explanation: "Quantifiers agree in gender/number with the noun; personas is feminine plural"
      - wrong: "Mucho gente"
        right: "Mucha gente"
        explanation: "gente is feminine singular, so mucho becomes mucha"
      - wrong: "Demasiado reuniones"
        right: "Demasiadas reuniones"
        explanation: "reuniones is feminine plural, so demasiado becomes demasiadas"
    preempt_at: A-08-numbers-quantifiers
    severity: medium
    persistence: "Corrects with attention to the adjective-agreement analogy; occasional slips when cognitive load is high"

  - id: english-stress-patterns
    english_cause: "English stress is unpredictable; Spanish stress follows clear rules"
    common_errors:
      - wrong: "Pronouncing 'teléfono' with English stress: te-LE-fo-no"
        right: "te-LÉ-fo-no (accent mark shows stress)"
      - wrong: "Ignoring accent marks when reading aloud"
        right: "Accent marks always override default stress rules"
    preempt_at: A-09-accent-stress-rules
    severity: medium
    persistence: "Improves with listening input but requires explicit awareness to fully resolve"
    pre_instruction_recast: true  # model correct stress in sessions 2-4 before formal rules in A-09

  - id: diminutive-underuse
    english_cause: "English has no productive diminutive morphology"
    common_errors:
      - observation: "Learner never uses -ito/-ita forms in casual speech"
        impact: "Sounds overly formal or distant, especially in Mexican Spanish"
        guidance: "Encourage use in affectionate and casual contexts"
    preempt_at: C-09-diminutives-augmentatives
    severity: low
    persistence: "Resolves with exposure and encouragement to try"

  - id: personal-a-omission
    english_cause: "English doesn't mark animate direct objects with a preposition"
    common_errors:
      - wrong: "Veo mi mamá"
        right: "Veo a mi mamá"
        explanation: "Spanish requires 'a' before human (animate) direct objects"
      - wrong: "Llamo mi hermano"
        right: "Llamo a mi hermano"
        explanation: "Personal 'a' is required even with family members"
    preempt_at: A-04-articles-prepositions
    severity: medium
    persistence: "Moderate — no English equivalent means it must be explicitly learned"

  - id: reflexive-pronoun-omission
    english_cause: "English often drops reflexive pronouns or uses non-reflexive equivalents"
    common_errors:
      - wrong: "Yo levanto a las siete"
        right: "Me levanto a las siete"
        explanation: "Levantarse is reflexive — the action is done to oneself"
      - wrong: "Ella ducha por la mañana"
        right: "Ella se ducha por la mañana"
        explanation: "Ducharse requires the reflexive pronoun"
    preempt_at: B-05-reflexive-verbs
    severity: medium
    persistence: "Persistent — English speakers don't think of 'getting up' as doing something to themselves"

  - id: ser-in-progressive
    english_cause: "English uses 'to be' for progressive; learners reach for ser instead of estar"
    common_errors:
      - wrong: "Soy comiendo"
        right: "Estoy comiendo"
        explanation: "Progressive always uses estar + gerund, never ser"
      - wrong: "Ella es hablando por teléfono"
        right: "Ella está hablando por teléfono"
        explanation: "Ser is never used for ongoing actions"
    preempt_at: B-08-estar-gerund-progressive
    severity: high
    persistence: "Can fossilize if not caught early — reinforces ser/estar distinction in a new context"

  - id: english-question-word-order
    english_cause: "English inverts subject/verb in questions; Spanish often doesn't require inversion"
    common_errors:
      - wrong: "¿Por qué tú quieres ir?"
        right: "¿Por qué quieres ir?"
        explanation: "Acceptable but overly English-influenced — natural Spanish drops the subject pronoun"
      - wrong: "¿Dónde tú vives?"
        right: "¿Dónde vives?"
        explanation: "Subject pronoun is redundant when verb conjugation makes the subject clear"
    preempt_at: A-05-basic-questions
    severity: low
    persistence: "Usually self-corrects with exposure to natural question patterns"

  - id: voseo-tu-conversion
    english_cause: >
      Most non-Rioplatense Spanish curricula teach the learner `tú` and `tú` verb
      forms (`comes`, `eres`, `vienes`). A learner targeting `es-AR` or `es-UY`
      hits authentic literature using `vos` (`comés`, `sos`, `venís`) and
      mis-conjugates by substituting `tú` forms.
    common_errors:
      - wrong: "Tú vienes mañana?"
        right: "¿Vos venís mañana?"
        explanation: "Voseo uses second-person singular morphology distinct from tú — drop the diphthong, shift stress."
      - wrong: "¿Cómo estás tú?"
        right: "¿Cómo estás vos?"
        explanation: "Pronoun and verb both shift; stress remains on the final syllable in present indicative."
      - wrong: "¿Comes algo?"
        right: "¿Comés algo?"
        explanation: "Present-indicative voseo drops the diphthong: -es → -és, -is → -ís."
    preempt_at: "media-bank:Mario Benedetti — La noche de los feos"
    severity: medium
    persistence: "Recoverable — voseo morphology is regular once seen; the friction is recognition, not production fossilization."
    pre_instruction_recast: false
    notes: >
      Cross-reference: `curriculum/tutor-guides/input-orchestration.md` Section 1
      Step 2 dialect re-filter advisory. When the tutor assigns the Benedetti
      entry to an es-AR or es-UY learner who has not yet seen voseo, the tutor
      should issue the preempt one-liner at assignment time:
      "Heads up — Benedetti is Uruguayan and uses `vos` / `comés` instead of
      `tú` / `comes`. Read it through once for gist; we'll cover voseo on the
      debrief."

  - id: vosotros-ustedes-recognition
    english_cause: >
      Latin-American Spanish curricula teach `ustedes` as the plural-you for all
      formality registers; vosotros never appears in production. A learner
      targeting any non-`es-ES` dialect hits authentic peninsular literature
      using `vosotros` (`venís`, `coméis`, `sois`) and stalls on comprehension
      — the form is unfamiliar morphology even though the meaning is "plural
      you (informal)".
    common_errors:
      - wrong: "(comprehension breakdown on) 'Vosotros sois mis amigos.'"
        right: "Vosotros sois mis amigos. (= Spanish-Spain way of saying 'You all are my friends'; LATAM uses 'Ustedes son mis amigos.')"
        explanation: "Vosotros is recognition-only for non-es-ES targets — the learner should map vosotros forms to ustedes mentally, not produce vosotros."
      - wrong: "¿Vosotros tenéis hambre? → 'Do you have hungry?'"
        right: "¿Vosotros tenéis hambre? → 'Do you all (informal plural) have hunger / Are you all hungry?'"
        explanation: "Map the morphology to LATAM's ustedes/tienen and the meaning is intact."
    preempt_at: "media-bank:Carmen Laforet — Nada Chapter 1"
    severity: low
    persistence: "Recognition only — non-es-ES learners will not produce vosotros, so there is no fossilization vector. The risk is mid-passage comprehension drop, not error."
    pre_instruction_recast: false
    notes: >
      Cross-reference: `curriculum/tutor-guides/input-orchestration.md` Section 1
      Step 2 dialect re-filter advisory. When the tutor assigns the Laforet
      entry (or any peninsular resource) to a non-es-ES learner, the tutor
      should issue the preempt one-liner at assignment time:
      "Heads up — Laforet is Spanish-Spain and uses `vosotros` (informal
      plural you). It's recognition-only for you — read it, you don't need to
      produce these forms. Tell me which vosotros forms you noticed on the
      debrief."

  - id: conditional-in-si-clause
    english_cause: "English allows 'If I would have...' constructions; learners carry this into Spanish si clauses"
    common_errors:
      - wrong: "Si tendría dinero, viajaría"
        right: "Si tuviera dinero, viajaría"
        explanation: "The si clause always takes the subjunctive, never the conditional"
      - wrong: "Si habría sabido, habría ido"
        right: "Si hubiera sabido, habría ido"
        explanation: "The si clause takes pluperfect subjunctive, not conditional perfect"
      - wrong: "Si yo era tú, hablaría con el jefe"
        right: "Si yo fuera tú, hablaría con el jefe"
        explanation: "Hypothetical/contrary-to-fact conditions require past subjunctive, not indicative"
    preempt_at: D-02-si-clauses
    severity: high
    persistence: "Persistent — the English 'If I would...' pattern is deeply ingrained in informal speech"

  - id: passive-overuse
    english_cause: "English uses passive voice far more frequently than Spanish; direct translation produces stilted, unnatural Spanish"
    common_errors:
      - wrong: "El español es hablado aquí"
        right: "Aquí se habla español"
        explanation: "Passive se is more natural than true passive for everyday speech"
      - wrong: "Es dicho que va a llover"
        right: "Se dice que va a llover"
        explanation: "Impersonal se, not true passive, for 'it is said that' constructions"
      - wrong: "Profesores son necesitados"
        right: "Se necesitan profesores"
        explanation: "Passive se for impersonal statements about what is needed"
      - wrong: "La comida es preparada por mi mamá"
        right: "Mi mamá prepara la comida"
        explanation: "Active voice is preferred in everyday speech; true passive sounds bookish"
    preempt_at: D-04-passive-voice
    severity: medium
    persistence: "Moderate — learners continue defaulting to passive structures from English for months; resolves with sustained input and feedback"
