name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        # 3.14 is not yet available on GitHub Actions hosted runners (as of mid-2026).
        # 3.12 is the most recent stable version with guaranteed runner support.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        # Enforce the [tool.ruff.lint] config in pyproject.toml, which claims to be
        # "repeatable in CI". ruff auto-excludes gitignored dirs (.venv etc.), so
        # `.` covers only the project's own Python (scripts/, tests/). Runs before
        # the test suite for fail-fast on unused imports / undefined names.
        run: ruff check .

      - name: Install a non-English locale
        # test_route_session arms its weekday-name trap with a real non-English
        # LC_TIME locale; hosted Ubuntu runners ship only C/en_US.
        run: sudo locale-gen es_ES.UTF-8

      - name: Run tests
        run: python -m pytest -q

      - name: Validate state schemas
        # Live learner state (state/*.yaml) is gitignored, so a clean CI checkout
        # has none to validate. Seed a fresh template-based state first — this
        # doubles as an integration smoke test of the init → validate path that
        # every new user runs via scripts/setup.py.
        run: |
          python3 scripts/init-student.py --force
          python3 scripts/validate-state.py

      - name: Check pre-commit hook syntax
        # Confirms the hook is valid bash; catches syntax regressions introduced
        # in the same PR that a --no-verify push would otherwise hide.
        run: bash -n .githooks/pre-commit
